plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'host.exp.exponent'
version = '1.0.0'

android {
  namespace "expo.modules.chalengine"
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName "1.0.0"
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
        cFlags "-std=gnu11 -O3 -Wall -Wextra"
        cppFlags "-std=c++20 -O3 -Wall -Wextra"
      }
    }
    ndk {
      abiFilters "arm64-v8a"
    }
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
}
